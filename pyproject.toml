[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mindwave"
version = "0.1.0"
description = "Biometric-driven adaptive music therapy pipeline (MindWave)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["music_ai_module*"]
