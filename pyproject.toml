[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mindwave"
version = "0.1.0"
description = "Biometric-driven adaptive music therapy pipeline (MindWave)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "numpy>=1.24",
    "beautifulsoup4>=4.12.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["music_ai_module*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

