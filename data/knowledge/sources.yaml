# Initial open-access / public-domain friendly seeds for GraphRAG ingestion.
# Run: python -m music_ai_module.knowledge ingest --sources data/knowledge/sources.yaml
# With LLM extraction: add --extract (requires OPENAI_API_KEY and compatible endpoints).

sources:
  - id: nccih_music_health
    url: https://www.nccih.nih.gov/health/providers/digest/music-and-health
    title: "Music and Health | NCCIH"
    license_note: "NCCIH pages are typically U.S. public domain; credit NCCIH as source."
    full_text_allowed: true
    topics: [anxiety, sleep, stress, pain, dementia, general]
    trust_score: 0.95

  - id: nccih_music_health_science
    url: https://www.nccih.nih.gov/health/providers/digest/music-and-health-science
    title: "Music and Health: What the Science Says | NCCIH"
    license_note: "NCCIH pages are typically U.S. public domain; credit NCCIH as source."
    full_text_allowed: true
    topics: [anxiety, sleep, stress, safety, pain, depression, dementia]
    trust_score: 0.98

  - id: nccih_anxiety_complementary
    url: https://www.nccih.nih.gov/health/anxiety-and-complementary-health-approaches
    title: "Anxiety and Complementary Health Approaches | NCCIH"
    license_note: "NCCIH pages are typically U.S. public domain; credit NCCIH as source."
    full_text_allowed: true
    topics: [anxiety, music_based_interventions, safety, medical_procedures]
    trust_score: 0.95

  - id: nccih_mbi_toolkit
